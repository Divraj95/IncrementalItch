name: Publish browser adventure

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify browser files
        run: |
          test -s docs/index.html
          test -s docs/build.json
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path("docs")
          version = json.loads((root / "build.json").read_text())["version"]
          for suffix in (".js", ".wasm", ".pck", ".audio.worklet.js", ".audio.position.worklet.js"):
              artifact = root / ("game-" + version + suffix)
              assert artifact.is_file() and artifact.stat().st_size > 0, artifact
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload playable build
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
